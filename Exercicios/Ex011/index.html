<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens flexiveis</title>
</head>
<body>
    <h1>Imagens dinâmicas com html</h1>
      <p>tente abrir em varios dispositivos diferentes, ou tente mudar a dimensao do navegador</p>
      <picture>
        <source media="(max-width: 750px)" srcset="img/pequena.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="img/media.png" type="image/png">
        <img src="img/grande.png" alt="grande">
      </picture>
      <h1>Reproduzindo Audios</h1>
      <p>vamos aprender a reproduzir audios no html 5</p>
      <audio preload="metadata" controls loop>
        <source src="midia/Creeping Up on You - Godmode.mp3" type="audio/mpeg">
        <source src="midia/Creeping Up on You - Godmode.ogg" type="audio/ogg">
        <source src="midia/Creeping Up on You - Godmode.wav" type="audio/wav">
        <p>infelizmente seu navegaador e incapaz de produzir audio <a href="midia/Creeping Up on You - Godmode.mp3">clique aqui caso deseje baixar o audio</a></p>
      </audio>
</body>
</html>
